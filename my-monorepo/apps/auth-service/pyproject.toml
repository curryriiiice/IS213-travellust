[tool.coverage.run]
branch = true
source = [ "auth_service" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/auth-service/html'
 --cov-report xml:'../../coverage/apps/auth-service/coverage.xml'
 --html='../../reports/apps/auth-service/unittests/html/index.html'
 --junitxml='../../reports/apps/auth-service/unittests/junit.xml'
"""

[project]
name = "auth-service"
version = "1.0.0"
description = "Auth microservice — issues JWTs, validates credentials via OutSystems."
requires-python = ">=3.9,<4"
readme = 'README.md'
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=5.0.0",
    "PyJWT>=2.10.1",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["auth_service"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
